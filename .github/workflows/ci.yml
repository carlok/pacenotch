name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the version baked into binaries: the tag on releases, git describe otherwise
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - name: Tools for the parity tests
        run: |
          bash --version | head -1
          jq --version || echo "no jq: parity tests will be skipped"
          curl --version | head -1 || echo "no curl: parity tests will be skipped"
      - name: Unit tests (race)
        run: go test -race ./...
      - name: GUI glue tests (race)
        run: go test -race -tags gui ./internal/gui/... ./cmd/...
      - name: Coverage (race unit + end-to-end, merged, gated)
        run: |
          scripts/cover.sh
          go tool cover -html=coverage/merged.out -o coverage.html
      - name: Fuzz (30s per target)
        run: scripts/fuzz.sh 30s
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage.html
            coverage/merged.out
          if-no-files-found: ignore
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ runner.os }}
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore

  cli:
    name: CLI-only binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: scripts/build-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pacenotch-cli
          path: dist/

  gui:
    name: GUI build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 keeps the Linux binary compatible with 22.04 and newer
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev
      - run: scripts/build-gui.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pacenotch-gui-${{ runner.os }}
          path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pacenotch-*
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
