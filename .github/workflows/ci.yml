name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Step 1-3 job: Ubuntu only. Step 5 turns this into the macOS/Windows/Ubuntu matrix.
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: make test
      - name: Coverage (race unit + end-to-end, merged, gated)
        run: make cover-html
      - name: Fuzz (30s per target)
        run: make fuzz FUZZTIME=30s
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: |
            coverage.html
            coverage/merged.out
          if-no-files-found: ignore
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore

  cli:
    name: CLI-only binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: pacenotch-cli
          path: dist/
